<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Page Not Found — HESO</title>
    <meta
      name="description"
      content="The page you're looking for could not be found on HESO."
    />
    <style>
      :root {
        --bg: #f7f8f6;
        --text: #17211b;
        --muted: #68736c;
        --line: #dce1dd;
        --accent: #1c6b4a;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }
      main {
        width: min(720px, 100%);
        text-align: center;
      }
      .logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 70px;
        text-decoration: none;
        color: var(--text);
        font-weight: 700;
        letter-spacing: -0.03em;
        font-size: 1.15rem;
      }
      .logo-mark {
        width: 32px;
        height: 32px;
        border: 2px solid var(--text);
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 0.7rem;
      }
      .code {
        font-size: clamp(6rem, 18vw, 10rem);
        font-weight: 800;
        letter-spacing: -0.08em;
        line-height: 0.8;
        color: var(--text);
      }
      h1 {
        font-size: clamp(1.7rem, 4vw, 2.5rem);
        margin: 38px 0 14px;
        letter-spacing: -0.04em;
      }
      p {
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.7;
        max-width: 500px;
        margin: auto;
      }
      .actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 34px;
        flex-wrap: wrap;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 13px 20px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.92rem;
        transition: 0.2s;
      }
      .primary {
        background: var(--text);
        color: white;
      }
      .secondary {
        border: 1px solid var(--line);
        color: var(--text);
        background: white;
      }
      a:hover {
        transform: translateY(-2px);
      }
      footer {
        margin-top: 80px;
        color: #8a938d;
        font-size: 0.8rem;
      }
      @media (max-width: 500px) {
        main {
          padding: 10px;
        }
        .logo {
          margin-bottom: 55px;
        }
        footer {
          margin-top: 60px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="logo" href="/">
        <span class="logo-mark">H</span>
        <span>HESO</span>
      </a>

      <div class="code">404</div>

      <h1>This page could not be found.</h1>

      <p>
        The page you're looking for may have been moved, removed, or the address
        may be incorrect. Let's get you back to HESO.
      </p>

      <div class="actions">
        <a class="primary" href="/">Back to home</a>
        <a class="secondary" href="contact.html">Contact HESO</a>
      </div>

      <footer>© HESO · Health &amp; Environmental Solution Organization</footer>
    </main>
  </body>
</html>
